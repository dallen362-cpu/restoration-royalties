<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Restoration Royalty Launch Portfolio</title>
<meta name="description" content="Private document. A passcode is required.">
<style>
  :root{
    --void:#050912; --panel:#0C1424; --panel2:#111C31; --line:#1E2E4A;
    --ink:#EAF2FF; --muted:#8FA3C0; --cyan:#00D4FF; --lime:#00FF88; --rose:#FF5C7A;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--void);color:var(--ink);padding:24px;
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .glow{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(720px 380px at 50% 8%,rgba(0,212,255,.13),transparent 70%)}
  .box{position:relative;width:100%;max-width:430px;background:var(--panel);
    border:1px solid var(--line);border-radius:18px;padding:38px 34px 32px;
    box-shadow:0 26px 70px rgba(0,0,0,.55)}
  .logo{font-weight:800;letter-spacing:.16em;font-size:11px;text-transform:uppercase;color:var(--muted);margin-bottom:26px}
  .logo b{color:var(--cyan)}
  h1{margin:0 0 8px;font-size:25px;letter-spacing:-.02em;line-height:1.2;font-weight:800}
  p.sub{margin:0 0 26px;color:var(--muted);font-size:14px}
  label{display:block;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
  input{width:100%;background:var(--void);border:1px solid var(--line);border-radius:10px;
    padding:14px 16px;color:var(--ink);font-size:17px;letter-spacing:.1em;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  input:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,212,255,.16)}
  button{width:100%;margin-top:16px;background:var(--cyan);color:#04121C;border:0;border-radius:10px;
    padding:14px;font-size:15px;font-weight:800;letter-spacing:.02em;cursor:pointer;
    transition:filter .16s,transform .16s}
  button:hover:not(:disabled){filter:brightness(1.1)}
  button:active:not(:disabled){transform:translateY(1px)}
  button:disabled{opacity:.6;cursor:progress}
  .msg{margin-top:14px;min-height:20px;font-size:13px;color:var(--rose)}
  .msg.ok{color:var(--lime)}
  .foot{margin-top:26px;padding-top:18px;border-top:1px solid var(--line);
    font-size:11px;color:var(--muted);line-height:1.6}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="glow"></div>
<form class="box" id="f" autocomplete="off">
  <div class="logo"><b>TEL</b>VERGENCE &nbsp;·&nbsp; PRIVATE DOCUMENT</div>
  <h1>Launch Portfolio</h1>
  <p class="sub">Restoration Royalty × Telvergence. Enter the passcode to open the portfolio.</p>
  <label for="pc">Passcode</label>
  <input id="pc" type="password" inputmode="text" autocapitalize="characters" spellcheck="false" placeholder="••••••••••">
  <button id="go" type="submit">Open portfolio</button>
  <div class="msg" id="m" role="status" aria-live="polite"></div>
  <div class="foot">This document is confidential and intended only for the named recipient. Trouble getting in? Call David at 689-242-1041.</div>
</form>
